# How people can fund Safelight. Shows a "Sponsor" button on the repo and on
# every release. See SPONSORS.md for tiers and the sponsorware model.
#
# NOTE: the `github` entry only renders once GitHub Sponsors is enabled for the
# account — set it up at https://github.com/sponsors and mirror the SPONSORS.md
# tiers there. Until then, Buy Me a Coffee still works.

github: [anthonyreimche]
buy_me_a_coffee: anthonyreimche

# Link the Sponsor button through to the full tier breakdown + sponsorware model.
custom: ['https://github.com/anthonyreimche/SafeLight/blob/main/SPONSORS.md']

