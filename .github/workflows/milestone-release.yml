name: Milestone Release

# When a milestone is closed, push a version tag to trigger the Release workflow.
#
# Requirements:
#   - The milestone title must be a semver version tag, e.g.  v1.2.0
#   - package.json version must already match the milestone title (the
#     Release workflow enforces this at build time)
#
# The new tag push triggers release.yml automatically.

on:
  milestone:
    types: [closed]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate milestone title is a version tag
        id: version
        run: |
          TITLE="${{ github.event.milestone.title }}"
          if [[ ! "$TITLE" =~ ^v[0-9]+\.[0-9]+\.[0-9] ]]; then
            echo "Milestone title '$TITLE' does not look like a version (expected v#.#.#). Skipping."
            exit 0
          fi
          echo "tag=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Create and push git tag
        if: steps.version.outputs.tag != ''
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "Tag $TAG already exists locally — skipping."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "Tag $TAG already exists on remote — skipping."
            exit 0
          fi
          git tag "$TAG" -m "Release $TAG"
          git push origin "$TAG"
