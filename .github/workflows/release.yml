name: Release

# Builds every installer and publishes them to a GitHub Release.
# Trigger: push a version tag, e.g.  git tag v1.0.6 && git push origin v1.0.6
#
#   Windows : NSIS .exe (x64)
#   macOS   : .dmg (x64 + arm64)   — unsigned/ad-hoc
#   Linux   : .AppImage (x64) + .deb (x64) + .pacman (Arch) + .flatpak + .rpm
#   NixOS   : flake package, attached as a portable .nar.gz closure export

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            ebflags: --win
            targets: ''
            artifacts: |
              release/*.exe
              release/*.blockmap
          - os: macos-latest
            name: macos
            ebflags: --mac
            targets: ''
            artifacts: |
              release/*.dmg
              release/*.zip
          - os: ubuntu-latest
            name: linux
            ebflags: --linux
            targets: appimage deb pacman rpm flatpak
            artifacts: |
              release/*.AppImage
              release/*.deb
              release/*.pacman
              release/*.rpm
              release/*.flatpak
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(jq -r .version package.json)
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Error: Git tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Version verified: $PKG_VERSION"

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Flatpak tools (Linux only)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Build renderer + main
        run: npm run build

      - name: Generate icons
        run: npm run icon

      - name: Build installers (${{ matrix.name }})
        run: npx --no-install electron-builder ${{ matrix.ebflags }} ${{ matrix.targets }} --publish never
        env:
          # No Apple/Windows signing certs in CI — build unsigned/ad-hoc so it never blocks.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Safelight ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: ${{ matrix.artifacts }}

  # NixOS: build the flake package and attach a portable closure export.
  # Install on NixOS with:
  #   gunzip -c safelight-<version>-nixos-x86_64.nar.gz | nix-store --import
  # then run the printed store path's /bin/safelight (or `nix run` from the tag).
  nix-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(jq -r .version package.json)
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Error: Git tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Version verified: $PKG_VERSION"

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build Nix package
        run: nix build .#safelight --print-build-logs

      - name: Export Nix closure
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          nix-store --export $(nix-store -qR ./result) \
            | gzip > "safelight-${VERSION}-nixos-x86_64.nar.gz"

      - name: Upload Nix closure to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Safelight ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: safelight-*-nixos-x86_64.nar.gz
