name: build-safelight

# Runs on every PR and push to main to verify the build works on all platforms
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build renderer + main
        run: npm run build

      - name: Verify build artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          test -f dist/index.html
          test -f electron/main.cjs
          echo "Build artifacts verified on ${{ matrix.os }}"

      - name: Verify build artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/index.html")) { exit 1 }
          if (-not (Test-Path "electron/main.cjs")) { exit 1 }
          Write-Host "Build artifacts verified on ${{ matrix.os }}"

  nix-build:
    # NixOS support: build the flake package so it can't silently break.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build Nix package
        run: nix build .#safelight --print-build-logs

      - name: Verify Nix build output
        run: |
          test -x result/bin/safelight
          echo "Nix package built on NixOS"

  build-safelight:
    needs: [build, nix-build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All builds passed
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "One or more platform builds failed"
            exit 1
          fi
          if [ "${{ needs.nix-build.result }}" != "success" ]; then
            echo "Nix build failed"
            exit 1
          fi
