<html lang="en">
<head>
<meta charset="utf-8">

<style>
body{margin:0;background:#525252}
a{color:#FFFFFF}a:hover{color:#FFFFFF}
[hidden]{display:none!important}
@media (max-width: 720px){.sl-nav{height:auto!important;flex-wrap:wrap;padding-top:8px!important;padding-bottom:8px!important}.sl-nav-links{order:3;width:100%;justify-content:center}}

.dl-page{background:#525252;color:#FFFFFF;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:17px;line-height:27px;font-optical-sizing:auto}
.dl-wrap{max-width:1280px;margin:0 auto;padding:0 clamp(20px,4.5vw,64px);box-sizing:border-box}
.dl-kicker{margin:0;font-size:15px;font-weight:500;color:#DCDCDC}
.dl-title{margin:14px 0 0;max-width:1000px;font-weight:600;font-size:clamp(44px,6.4vw,92px);line-height:1.02;letter-spacing:-0.025em}
.dl-dot{display:inline-block;width:0.15em;height:0.15em;margin-left:0.04em;border-radius:50%;background:#E5172F;box-shadow:0 0 18px rgba(229,23,47,0.75)}
.dl-meta{margin:24px 0 0;max-width:720px;font-size:19px;line-height:29px;color:#DCDCDC}
.dl-meta:empty{display:none}
.dl-direct{margin:14px 0 0;font-size:16px;color:#DCDCDC}
.dl-direct:empty{display:none}
.dl-button{display:inline-flex;align-items:center;height:52px;padding:0 26px;border-radius:999px;background:#FFFFFF;color:#1E1E1E!important;font-weight:600;font-size:16px;text-decoration:none}
.dl-note{margin-top:40px;max-width:720px;padding:22px 26px;border-radius:14px;background:#2E2E2E;box-shadow:0 14px 34px rgba(0,0,0,0.25)}
.dl-note h2{margin:0 0 6px;font-weight:600;font-size:17px}
.dl-note p{margin:0;color:#DCDCDC}
.dl-note p+p{margin-top:12px}
.dl-note code{font-size:14px;padding:1px 6px;border-radius:5px;background:#1E1E1E}
.dl-note .dl-cmd{display:block;margin-top:10px;padding:10px 14px;overflow-x:auto;white-space:nowrap}
.dl-all{margin-top:120px;padding-top:80px;border-top:1px solid rgba(255,255,255,0.18)}
.dl-all>h2{margin:0;font-weight:600;font-size:clamp(36px,4.4vw,60px);line-height:1.05;letter-spacing:-0.02em}
.dl-os{margin-top:48px}
.dl-os h3{margin:0 0 12px;font-weight:600;font-size:22px}
.dl-file{display:grid;grid-template-columns:minmax(160px,1.2fr) minmax(0,2fr) auto auto;align-items:center;gap:8px 24px;padding:12px 12px 12px 20px;border-radius:12px;background:#2E2E2E}
.dl-file+.dl-file{margin-top:8px}
.dl-file.mine{box-shadow:inset 0 0 0 2px #FFFFFF}
.dl-kind{font-weight:600}
.dl-name{font-size:14px;color:#A8A8A8;overflow-wrap:anywhere}
.dl-size{font-size:14px;color:#DCDCDC;white-space:nowrap}
.dl-get{display:inline-flex;align-items:center;height:40px;padding:0 18px;border:1px solid rgba(255,255,255,0.5);border-radius:999px;font-weight:500;font-size:15px;text-decoration:none}
.dl-get:hover{background:#FFFFFF;color:#1E1E1E!important}
.dl-file.mine .dl-get{background:#FFFFFF;color:#1E1E1E!important}
.dl-links{display:flex;flex-wrap:wrap;gap:8px 24px;margin:40px 0 0;font-size:16px}
@media (max-width: 720px){.dl-file{grid-template-columns:1fr auto}.dl-name{grid-column:1/-1;order:3}}
</style>
</head>
<body>
<div class="dl-page">

<nav style="border-bottom: 1px solid rgba(255,255,255,0.14)">
<div class="sl-nav" style="max-width: 1280px; margin: 0 auto; padding: 0 clamp(20px, 4.5vw, 64px); height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 16px; box-sizing: border-box">
<a href="index.html" aria-label="Safelight home" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; text-decoration: none; font-weight: 600; font-size: 17px"><img src="img/logo-icon.png" alt="" style="display: block; width: auto; height: 38px">Safelight</a>
<div class="sl-nav-links" style="display: flex; flex-wrap: wrap; gap: 4px 28px; font-size: 16px">
<a href="index.html" style="min-height: 44px; display: inline-flex; align-items: center; text-decoration: none; color: #DCDCDC">Photographers</a>
<a href="developers.html" style="min-height: 44px; display: inline-flex; align-items: center; text-decoration: none; color: #DCDCDC">Developers</a>

<a href="download.html" aria-current="page" style="display: inline-flex; align-items: center; height: 40px; padding: 0 18px; border-radius: 999px; background: #FFFFFF; color: #1E1E1E; font-weight: 500; font-size: 15px; text-decoration: none">Download</a>
</div>
</nav>

<header class="dl-wrap" style="padding-top: 96px">
<p class="dl-kicker">Download</p>
<h1 class="dl-title"><span id="title">Download Safelight</span><span class="dl-dot" aria-hidden="true"></span></h1>
<p class="dl-meta" id="meta"></p>
<p class="dl-direct" id="direct"></p>
<noscript><p class="dl-meta">The downloads are on the <a href="https://github.com/anthonyreimche/SafeLight/releases/latest">releases page</a>.</p></noscript>
<div class="dl-note" id="note" role="note" hidden></div>
</header>

<main class="dl-wrap">
<section class="dl-all" id="all" aria-labelledby="all-title" hidden>
<h2 id="all-title">Every download</h2>
<div id="files"></div>
<p class="dl-links" id="links"></p>
</section>
</main>

<footer style="margin-top: 140px; border-top: 1px solid rgba(255,255,255,0.18)">
<div style="max-width: 1280px; margin: 0 auto; padding: 40px clamp(20px, 4.5vw, 64px) 56px; box-sizing: border-box; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 32px">
<div style="display: flex; align-items: center; gap: 16px">
<img src="img/logo-icon.png" alt="Safelight" style="display: block; width: auto; height: 64px">
<span style="font-size: 14px; line-height: 22px; color: #DCDCDC">A lean core plus the open source extension library.<br>Named for the red lamp photographers print by.</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 4px 24px; font-size: 14px">
<a href="index.html" style="min-height: 32px; display: inline-flex; align-items: center; text-decoration: none; color: #DCDCDC">Photographers</a>
<a href="developers.html" style="min-height: 32px; display: inline-flex; align-items: center; text-decoration: none; color: #DCDCDC">Developers</a>
<a href="labs.html" style="min-height: 32px; display: inline-flex; align-items: center; text-decoration: none; color: #DCDCDC">Labs</a>
<a href="https://github.com/anthonyreimche/SafeLight/blob/main/docs/user/README.md" target="_blank" rel="noopener" style="min-height: 32px; display: inline-flex; align-items: center; text-decoration: none; color: #DCDCDC">Manual</a>
<a href="https://github.com/anthonyreimche/SafeLight" target="_blank" rel="noopener" style="min-height: 32px; display: inline-flex; align-items: center; text-decoration: none; color: #DCDCDC">GitHub</a>
<a href="https://github.com/anthonyreimche/SafeLight/blob/main/PRIVACY.md" target="_blank" rel="noopener" style="min-height: 32px; display: inline-flex; align-items: center; text-decoration: none; color: #DCDCDC">Privacy</a>
</div>
</div>
</footer>
</div>

<script>
(function () {
  "use strict";
  var REPO = "https://github.com/anthonyreimche/SafeLight";
  var API = "https://api.github.com/repos/anthonyreimche/SafeLight/releases/latest";
  var GUIDE = REPO + "/blob/main/docs/user/installation.md#troubleshooting";

  // Every kind of file a release carries, in list order. `target` marks the
  // one a detected system downloads.
  var KINDS = [
    { os: "Windows", kind: "Installer", test: /\.exe$/i, target: "windows" },
    { os: "macOS", kind: "Apple Silicon", test: /-arm64\.dmg$/i, target: "mac-arm" },
    { os: "macOS", kind: "Intel", test: /^(?!.*-arm64\.dmg$).*\.dmg$/i, target: "mac-intel" },
    { os: "Linux", kind: "AppImage", test: /\.AppImage$/i, target: "linux" },
    { os: "Linux", kind: "Debian and Ubuntu (.deb)", test: /\.deb$/i },
    { os: "Linux", kind: "Fedora and openSUSE (.rpm)", test: /\.rpm$/i },
    { os: "Linux", kind: "Arch (.pacman)", test: /\.pacman$/i },
    { os: "Linux", kind: "Flatpak", test: /\.flatpak$/i },
  ];
  var SYSTEM = { windows: "Windows", "mac-arm": "macOS (Apple Silicon)", "mac-intel": "macOS (Intel)", linux: "Linux" };
  var NOTE = {
    windows: "The first time, Windows may say it protected your PC. Choose <b>More info</b>, then <b>Run anyway</b>.",
    mac: "macOS may say the app is damaged. It isn't. Drag Safelight to Applications, then run this in Terminal:<code class=\"dl-cmd\">xattr -cr /Applications/Safelight.app</code>",
    linux: "Make the AppImage executable with <code>chmod +x</code>, then run it. The Debian, Fedora, Arch and Flatpak packages are listed below.",
  };

  function el(tag, props) {
    var node = Object.assign(document.createElement(tag), props);
    node.append.apply(node, Array.prototype.slice.call(arguments, 2));
    return node;
  }
  function link(href, text, props) {
    return el("a", Object.assign({ href: href }, props), text);
  }
  function megabytes(bytes) {
    return (bytes / 1e6).toFixed(1) + " MB";
  }
  function released(iso) {
    return new Date(iso).toLocaleDateString("en-CA", { day: "numeric", month: "long", year: "numeric" });
  }

  // Browsers without userAgentData (Safari, Firefox) can't tell an Intel Mac
  // from Apple Silicon, so Apple Silicon is the default and the Intel file is
  // offered next to it.
  function detectTarget() {
    var data = navigator.userAgentData;
    var ua = navigator.userAgent;
    var platform = data ? data.platform : "";
    if ((data && data.mobile) || /Android|iPhone|iPad|iPod|CrOS/.test(ua) || platform === "Chrome OS") return Promise.resolve(null);
    if (platform === "Windows" || (!platform && /Windows/.test(ua))) return Promise.resolve("windows");
    if (platform === "macOS" || (!platform && /Macintosh/.test(ua))) {
      if (navigator.maxTouchPoints > 1) return Promise.resolve(null);
      if (!data) return Promise.resolve("mac-arm");
      return data
        .getHighEntropyValues(["architecture"])
        .catch(function () { return {}; })
        .then(function (hints) { return hints.architecture === "x86" ? "mac-intel" : "mac-arm"; });
    }
    if (platform === "Linux" || (!platform && /Linux|X11/.test(ua))) return Promise.resolve("linux");
    return Promise.resolve(null);
  }

  function latestRelease() {
    var abort = new AbortController();
    var timer = setTimeout(function () { abort.abort(); }, 8000);
    return fetch(API, { headers: { Accept: "application/vnd.github+json" }, signal: abort.signal })
      .then(function (res) {
        if (!res.ok) throw new Error("GitHub answered " + res.status);
        return res.json();
      })
      .finally(function () { clearTimeout(timer); });
  }

  function show(o) {
    document.getElementById("title").textContent = o.title;
    document.getElementById("meta").replaceChildren.apply(document.getElementById("meta"), o.meta || []);
    document.getElementById("direct").replaceChildren.apply(document.getElementById("direct"), o.direct || []);
    var box = document.getElementById("note");
    box.hidden = !o.note;
    if (o.note) box.innerHTML = "<h2>First launch</h2><p>" + o.note + '</p><p><a href="' + GUIDE + '">Full install guide</a></p>';
  }

  function listFiles(release, mine) {
    var files = document.getElementById("files");
    ["Windows", "macOS", "Linux"].forEach(function (os) {
      var rows = [];
      KINDS.filter(function (k) { return k.os === os; }).forEach(function (k) {
        release.assets.filter(function (a) { return k.test.test(a.name); }).forEach(function (a) {
          rows.push(
            el("div", { className: "dl-file" + (a === mine ? " mine" : "") },
              el("span", { className: "dl-kind" }, k.kind),
              el("span", { className: "dl-name" }, a.name),
              el("span", { className: "dl-size" }, megabytes(a.size)),
              link(a.browser_download_url, "Download", { className: "dl-get", ariaLabel: "Download " + a.name })),
          );
        });
      });
      if (rows.length) files.append(el.apply(null, ["section", { className: "dl-os" }, el("h3", {}, os)].concat(rows)));
    });
    document.getElementById("links").replaceChildren(link(release.html_url, "Release notes"), link(REPO + "/releases", "All releases"));
    document.getElementById("all").hidden = false;
  }

  document.getElementById("title").textContent = "Finding the newest Safelight…";
  Promise.all([detectTarget(), latestRelease().catch(function () { return null; })]).then(function (got) {
    var target = got[0];
    var release = got[1];
    if (!release || !Array.isArray(release.assets)) {
      show({
        title: "GitHub didn't answer",
        meta: ["The downloads are on the releases page."],
        direct: [link(REPO + "/releases/latest", "Open the releases page", { className: "dl-button" })],
      });
      return;
    }
    var version = String(release.tag_name).replace(/^v/, "");
    function fileFor(t) {
      var kind = KINDS.find(function (k) { return k.target === t; });
      return release.assets.find(function (a) { return kind.test.test(a.name); });
    }
    var asset = target && fileFor(target);
    listFiles(release, asset);
    if (!target) {
      show({ title: "Safelight is a desktop app", meta: ["Pick a download for Windows, macOS or Linux."] });
      return;
    }
    if (!asset) {
      show({
        title: "Safelight " + version,
        meta: ["This release has no download for " + SYSTEM[target] + " yet. Pick another one below or see ", link(REPO + "/releases", "all releases"), "."],
      });
      return;
    }
    var direct = ["Didn't start? ", link(asset.browser_download_url, "Download it directly"), "."];
    var otherMac = { "mac-arm": "mac-intel", "mac-intel": "mac-arm" }[target];
    var other = otherMac && fileFor(otherMac);
    if (other) direct.push(target === "mac-arm" ? " On an Intel Mac? " : " On Apple Silicon? ", link(other.browser_download_url, "Get that version"), ".");
    show({
      title: "Downloading Safelight " + version,
      meta: ["For " + SYSTEM[target] + ", " + megabytes(asset.size) + ", released " + released(release.published_at) + ". Free."],
      direct: direct,
      note: NOTE[target.indexOf("mac") === 0 ? "mac" : target],
    });
    location.assign(asset.browser_download_url);
  });
})();
</script>
</body>
</html>
